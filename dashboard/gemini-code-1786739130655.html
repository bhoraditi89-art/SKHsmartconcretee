<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Concrete | Live Health Monitor</title>
    
    <!-- Paho MQTT Library for connecting to the broker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #0272B1; }
        .container {
            background-color: #16213e;
            border-radius: 10px;
            padding: 30px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .status {
            margin-bottom: 20px;
            font-weight: bold;
            color: #e94560; /* Red by default, turns green when connected */
        }
        .data-box {
            background-color: #0f3460;
            border: 2px solid #0272B1;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .strain-value {
            font-size: 48px;
            font-weight: bold;
            color: #68b631; /* Green */
        }
        .alert-box {
            background-color: #e94560;
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            display: none; /* Hidden by default */
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>🧱 Smart Concrete Dashboard</h1>
    
    <div class="container">
        <div id="connection-status" class="status">🔴 Disconnected from Broker</div>

        <div class="data-box">
            <h3>Live Structural Strain</h3>
            <div id="strain-display" class="strain-value">0.0%</div>
        </div>

        <!-- This box will flash red when the ESP32 sends a crack alert -->
        <div id="alert-display" class="alert-box">
            ⚠️ CRACK DETECTED! ACTIVATING BACTERIAL HEALING...
        </div>
    </div>

    <script>
        // --- MQTT CONFIGURATION ---
        // Connects to the same free broker as your ESP32
        const broker = "broker.hivemq.com";
        const port = 8000; // WebSocket port for HiveMQ
        
        // Generate a random client ID for the web browser
        const clientId = "web-dashboard-" + Math.random().toString(16).substr(2, 8);

        // Topics must match the ESP32 code exactly
        const TOPIC_STRAIN = "dipex2026/concrete/strain";
        const TOPIC_ALERT = "dipex2026/concrete/alerts";

        // Initialize MQTT Client
        const client = new Paho.MQTT.Client(broker, port, clientId);

        // Set callback handlers
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        // Connect the client
        client.connect({ onSuccess: onConnect });

        function onConnect() {
            console.log("Connected to MQTT Broker!");
            const statusDiv = document.getElementById("connection-status");
            statusDiv.innerHTML = "🟢 Connected to Live Sensor Data";
            statusDiv.style.color = "#68b631";

            // Subscribe to the ESP32 topics
            client.subscribe(TOPIC_STRAIN);
            client.subscribe(TOPIC_ALERT);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Connection Lost: " + responseObject.errorMessage);
                const statusDiv = document.getElementById("connection-status");
                statusDiv.innerHTML = "🔴 Connection Lost - Attempting to reconnect...";
                statusDiv.style.color = "#e94560";
            }
        }

        // Handle incoming data from the ESP32
        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            if (topic === TOPIC_STRAIN) {
                // Update the large strain number on the dashboard
                document.getElementById("strain-display").innerText = parseFloat(payload).toFixed(1) + "%";
            } 
            else if (topic === TOPIC_ALERT && payload === "CRACK_DETECTED") {
                // Show the flashing red alert box
                const alertBox = document.getElementById("alert-display");
                alertBox.style.display = "block";
                
                // Automatically hide the alert after 5 seconds
                setTimeout(() => {
                    alertBox.style.display = "none";
                }, 5000);
            }
        }
    </script>
</body>
</html>
